key_file = "/var/lib/vmango/authorized_keys"


api {
    console_link_lifetime_seconds = 3600
    # Use a persistent random secret (openssl rand -hex 32), never commit it.
    # console_signing_key = "..."

    debug = false
    listen = ":8080"
    # Generate once with openssl rand -hex 32; preserve across restarts.
    jwt_signing_key = "REPLACE_WITH_RANDOM_SECRET"
    console_signing_key = "REPLACE_WITH_SEPARATE_RANDOM_SECRET"
    session_dir = "/var/lib/vmango/sessions"
    token_dir = "/var/lib/vmango/tokens"

    # Public URL, also used for CSRF origin checks behind an HTTPS proxy.
    # For HTTPS, set base_url to https://... and session_secure = true.
    # base_url = "http://localhost:8080"
    # oidc {
    #     title = "Google"
    #     client_id = "..."
    #     client_secret = "..."
    #     issuer_url = "https://accounts.google.com"
    #     allowed_emails = ["asdf@gmail.com"]
    # }

    # Uncomment to set admin / admin password or generate new hash with `vmango genpw`
    # user "admin" {
    #     email = "admin@example.com"
    #     hashed_password = "$2a$10$igHQGROHntvl05AztpfMeONSBDUsEbZHxayc5DOPTKIFX50WrHURS"
    # }
    #
    # Topbar links example
    # links_title = "Region"
    # link "Home" {
    #     active = true
    #     url = "http://localhost:8080/"
    # }
    # link "DC1" {
    #     url = "http://dc1.example.com:8080/"
    # }
    # link "DC2" {
    #     url = "http://dc2.example.com:8080/"
    # }
}

