# Image IDs are independent of paths. The same path is resolved on the selected node.
image "ubuntu-server" {
    path = "/var/lib/libvirt/images/ubuntu-cloud.img"
    name = "Ubuntu server"
    os_name = "Ubuntu"
    os_version = "24.04"
    os_arch = "x86_64"
    protected = true
    # Omitted launch settings retain the existing defaults.
    # firmware = "efi"               # auto, bios or efi; must be supported by the node
    # disk_bus = "scsi"              # default: virtio
    # disk_controller = "virtio-scsi" # requires disk_bus = "scsi"
    # nic_model = "virtio"
    # guest_agent = false            # default: true; false is explicit
    # initialization = "none"        # none, nocloud or openstack; default: node format
    # minimum_memory_mib = 1024
    # minimum_disk_gib = 8
}

