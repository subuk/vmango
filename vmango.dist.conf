# Durable infrastructure task commands and history. 0 retains history indefinitely.
tasks {
    directory = "/var/lib/vmango/tasks"
    workers = 2
    retention_days = 0
}

# Cloud catalog and host connections to existing libvirt infrastructure.
# Add further host blocks to the same zone for automatic multi-host placement.
cloud "local" {
    name = "Local cloud"
    images = ["ubuntu-24.04-x86_64-bios", "debian-13-x86_64-bios", "fedora-44-x86_64-bios", "alma-9.8-x86_64-bios", "rocky-9.8-x86_64-bios", "alpine-3.24.3-x86_64-bios", "ubuntu-24.04-aarch64-uefi", "debian-13-aarch64-uefi", "fedora-44-aarch64-uefi", "alma-9.8-aarch64-uefi", "rocky-9.8-aarch64-uefi", "alpine-3.24.3-aarch64-uefi"]
    zone "local" { name = "Local zone" }
    instance_type "small" {
        name = "Small"
        cpu = 2
        cpu_request = 1
        memory_mib = 2048
        # memory_request_mib defaults to memory_mib and must equal it.
        boot_disk_gib = 20
        autostart = false # Persistent policy, independent of create start=true.
    }
    instance_type "medium" {
        name = "Medium"
        cpu = 4
        cpu_request = 2
        memory_mib = 4096
        boot_disk_gib = 40
    }
    network "lan" { name = "LAN" }
    storage_class "standard" { name = "Standard" }
    host "local" {
        # Private backend listener; empty preserves the libvirt default.
        # graphics_listen = "127.0.0.1"
        uri = "qemu:///system"
        image_pool = "default" # Existing dir pool; image storage remains on this node.
        config_drive_pool = "default"
        config_drive_suffix = "_config.iso"
        qcow_prealloc_metadata = true
        zone = "local"
        cpu_reserve = 1
        memory_reserve_mib = 1024
        labels = { rack = "local" }
        # For local macOS/HVF, set uri = "qemu:///session" and, if needed:
        # emulator = "/Users/username/bin/socket-vmnet-qemu-system-aarch64"
        # config_drive_write_format = "openstack"
        network "lan" { network = "default" }
        storage_class "standard" { pool = "default" format = "qcow2" }
    }
}
