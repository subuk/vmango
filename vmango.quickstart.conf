# See https://vmango.org/docs/start/ before starting the server.
key_file = "./authorized_keys"

api {
    listen = "127.0.0.1:8080"
    base_url = "http://localhost:8080"
    jwt_signing_key_file = "~/.vmango/jwt_signing_key"
    console_signing_key_file = "~/.vmango/console_signing_key"
    session_dir = "~/.vmango/sessions"
    token_dir = "~/.vmango/tokens"

    user "admin" {
        hashed_password = "REPLACE_WITH_GENPW_OUTPUT"
    }
}

# Durable infrastructure task commands and history. 0 retains history indefinitely.
tasks {
    directory = "~/.vmango/tasks"
    workers = 2
    retention_days = 0
}

cloud "local" {
    image "ubuntu-24.04-x86_64-bios" {
        name = "Ubuntu Cloud"
        os_name = "Ubuntu"
        os_version = "24.04 / 20261017"
        os_arch = "x86_64"
        url = "https://cloud-images.ubuntu.com/noble/20261017/noble-server-cloudimg-amd64.img"
        sha256 = "04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94"
        source_format = "qcow2"
        source_size_bytes = 621284352
        firmware = "bios"
        disk_bus = "virtio"
        nic_model = "virtio"
        guest_agent = false
        initialization = "nocloud"
        minimum_memory_mib = 1024
        minimum_disk_gib = 8
    }
    image "ubuntu-24.04-aarch64-uefi" {
        name = "Ubuntu Cloud"
        os_name = "Ubuntu"
        os_version = "24.04 / 20261017"
        os_arch = "aarch64"
        url = "https://cloud-images.ubuntu.com/noble/20261017/noble-server-cloudimg-arm64.img"
        sha256 = "50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e"
        source_format = "qcow2"
        source_size_bytes = 616522752
        firmware = "efi"
        disk_bus = "virtio"
        nic_model = "virtio"
        guest_agent = false
        initialization = "nocloud"
        minimum_memory_mib = 1024
        minimum_disk_gib = 8
    }
    zone "local" {}
    instance_type "small" { cpu=2 memory_mib=2048 boot_disk_gib=20 }
    network "lan" {}
    storage_class "standard" {}
    host "local" {
        uri = "qemu:///system"
        config_drive_pool = "default"
        zone="local"
        cpu_reserve=1
        memory_reserve_mib=1024
        network "lan" { network="default" }
        storage_class "standard" { pool="default" }
    }
}
