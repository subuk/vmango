name: Test Debian package compatibility

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published stable package version without v'
        type: string
        required: true
      revision:
        description: 'Published package revision'
        type: string
        default: '1'
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        required: true
      revision:
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  debian-compatibility:
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the Jammy package and test startup on Debian amd64
        env:
          PUBLICATION_CHANNEL: ${{ inputs.channel || 'stable' }}
          VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.revision }}
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm --platform linux/amd64 \
            -e PUBLICATION_CHANNEL -e VERSION -e PACKAGE_REVISION \
            -v "$PWD:/src:ro" "debian:$SUITE-slim" \
            bash /src/scripts/release/test-debian-compatibility.sh
