name: Test distribution packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Trusted branch, tag or commit to test'
        type: string
        required: true
        default: master
      version:
        description: 'Next stable version without v; test packages sort below it'
        type: string
        required: true
      copr:
        description: 'Test RHEL 9/10 x86_64 in subuk/vmango-devel'
        type: boolean
        default: true
      ppa:
        description: 'Test Ubuntu LTS amd64 in ppa:subuk/vmango-devel'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: test-distribution-packages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Resolve the exact source and unique test version
        id: source
        env:
          BASE_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(gh api "repos/$GH_REPO/commits/$SOURCE_REF" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION~test.$GITHUB_RUN_ID.g$sha" >> "$GITHUB_OUTPUT"
  sources:
    needs: prepare
    uses: ./.github/workflows/package-sources.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
  upload:
    needs: [prepare, sources]
    uses: ./.github/workflows/upload-packages.yml
    with:
      channel: devel
      version: ${{ needs.prepare.outputs.version }}
      copr: ${{ inputs.copr }}
      ppa: ${{ inputs.ppa }}
    secrets: inherit
