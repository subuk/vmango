name: Build Docker image

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Resolve image source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false
      - name: Build image with embedded frontend and run Go tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: vmango:tested-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ steps.source.outputs.sha }}
      - name: Export image for runtime verification
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save --output "$RUNNER_TEMP/vmango-image.tar" "vmango:tested-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/vmango-image.tar
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # Runner-side scripts must come from the workflow, not source_ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Check container runtime on its native architecture
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          docker load --input "$RUNNER_TEMP/vmango-image.tar"
          python3 scripts/release/docker-smoke.py "vmango:tested-$ARCH" "$VERSION" "$ARCH"
