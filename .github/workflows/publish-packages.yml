name: Publish distribution packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing published stable release version without v'
        type: string
        required: true
      revision:
        description: 'Package revision; increase for a corrected package upload'
        type: string
        default: '1'
      copr:
        description: 'Publish to stable COPR subuk/vmango'
        type: boolean
        default: true
      ppa:
        description: 'Publish to stable ppa:subuk/vmango'
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      revision:
        type: string
        default: '1'
      copr:
        type: boolean
        default: false
      ppa:
        type: boolean
        default: false
    secrets:
      COPR_CONFIG:
        required: false
      PPA_GPG_PRIVATE_KEY:
        required: false
      PPA_GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

concurrency:
  group: distribution-packages-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Validate published release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]]
          gh release view "v$VERSION" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("Expected a published stable release") else . end'
          sha=$(gh api "repos/$GH_REPO/commits/v$VERSION" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  sources:
    needs: prepare
    uses: ./.github/workflows/package-sources.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.version }}
      revision: ${{ inputs.revision }}
  upload:
    needs: [prepare, sources]
    uses: ./.github/workflows/upload-packages.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
      revision: ${{ inputs.revision }}
      copr: ${{ inputs.copr }}
      ppa: ${{ inputs.ppa }}
    secrets: inherit
