# Replace the cloud image path, network and pool with resources on your host.
cloud "graphics-demo" {
    hardware_profile "server-serial" {
        disks { bus = "virtio" }
        nic_model = "virtio"
        graphics { type = "none" }
    }
    hardware_profile "server-vnc" {
        disks { bus = "virtio" }
        nic_model = "virtio"
        graphics { type = "vnc" video_model = "virtio" }
        input { keyboard = "usb" pointer = "usb-tablet" }
    }
    hardware_profile "headless-usb" {
        graphics { type = "none" }
        usb_controller { model = "qemu-xhci" }
    }
    hardware_profile "vmvga-mouse" {
        graphics { type = "vnc" video_model = "vmvga" }
        input { keyboard = "usb" pointer = "usb-mouse" }
    }
    hardware_profile "keyboard-only" { input { pointer = "none" } }
    hardware_profile "input-disabled" { input { keyboard = "none" pointer = "none" } }
    hardware_profile "minimal" {}
    image "serial-server" { hardware_profile = "server-serial" path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" }
    image "vnc-server" { hardware_profile = "server-vnc" path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" }
    image "vmvga-server" { hardware_profile = "vmvga-mouse" path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" }
    zone "local" {}
    instance_type "server" { cpu = 2 memory_mib = 2048 boot_disk_gib = 10 }
    network "lan" {}
    storage_class "standard" {}
    host "local" {
        uri = "qemu:///system"
        zone = "local"
        network "lan" { network = "default" }
        storage_class "standard" { pool = "default" format = "qcow2" }
    }
}
