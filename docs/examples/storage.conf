# Replace paths and bindings with guest-compatible resources on your host.
cloud "storage" {
    hardware_profile "virtio-block-serial" {
        disks { bus = "virtio" }
        graphics = "none"
        video_model = "none"
    }
    hardware_profile "virtio-scsi-vnc" {
        disks { bus = "scsi" controller_model = "virtio-scsi" }
        graphics = "vnc"
        video_model = "none"
        config_drive { bus = "scsi" controller_model = "virtio-scsi" }
    }
    hardware_profile "lsi-scsi" {
        machine { type = "pc" }
        disks { bus = "scsi" controller_model = "lsilogic" }
        config_drive {
            format = "openstack"
            device_type = "cdrom"
            bus = "scsi"
            controller_model = "virtio-scsi"
        }
    }
    hardware_profile "sas" {
        disks { bus = "scsi" controller_model = "lsisas1068" }
    }
    hardware_profile "pvscsi" {
        disks { bus = "scsi" controller_model = "vmpvscsi" }
    }
    hardware_profile "ide" {
        machine { type = "pc" }
        disks { bus = "ide" }
        config_drive { bus = "ide" device_type = "cdrom" }
    }
    hardware_profile "sata-with-config-cdrom" {
        machine { type = "q35" }
        disks { bus = "sata" }
        config_drive { bus = "sata" device_type = "cdrom" }
    }
    image "block" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "virtio-block-serial" }
    image "scsi" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "virtio-scsi-vnc" }
    image "lsi" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "lsi-scsi" }
    image "sas" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "sas" }
    image "pvscsi" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "pvscsi" }
    image "ide" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "ide" }
    image "sata" { path = "/var/lib/libvirt/images/cloud.qcow2" os_arch = "x86_64" hardware_profile = "sata-with-config-cdrom" }
    zone "local" {}
    instance_type "server" { cpu = 2 memory_mib = 2048 boot_disk_gib = 10 }
    network "lan" {}
    storage_class "standard" {}
    host "local" {
        uri = "qemu:///system"
        zone = "local"
        network "lan" { network = "default" }
        storage_class "standard" { pool = "default" format = "qcow2" }
    }
}
